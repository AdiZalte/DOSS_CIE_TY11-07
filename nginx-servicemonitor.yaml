
apiVersion: v1
kind: Service
metadata:
  name: devops-app-metrics
  namespace: default
  labels:
    app: devops-app
spec:
  clusterIP: None
  selector:
    app: devops-app
  ports:
    - name: metrics
      port: 9113
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-app
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: devops-app
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
