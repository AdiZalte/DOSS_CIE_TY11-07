
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  labels:
    app: devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
        - name: web
          image: devops-cie-app:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80

        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.4.2
          args:
            - --nginx.scrape-uri=http://127.0.0.1:80/nginx_status
          ports:
            - name: metrics
              containerPort: 9113
